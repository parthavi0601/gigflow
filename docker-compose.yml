version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: gigflow-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - gigflow-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gigflow-server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/gigflow
    depends_on:
      - mongo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - gigflow-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: gigflow-client
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gigflow-net

networks:
  gigflow-net:
    driver: bridge

volumes:
  mongo_data:

